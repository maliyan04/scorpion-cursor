<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Scorpion Cursor</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    cursor: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #hint {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font: 13px system-ui, sans-serif;
    letter-spacing: 0.5px;
    pointer-events: none;
    user-select: none;
  }

  #aboutBtn {
    position: fixed;
    bottom: 18px;
    right: 18px;
    padding: 9px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    color: rgba(235,235,235,0.85);
    font: 13px system-ui, sans-serif;
    letter-spacing: 0.3px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s ease, border-color 0.2s ease;
    z-index: 10;
    touch-action: manipulation;
  }
  #aboutBtn:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.4);
  }

  #aboutOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    cursor: pointer;
    touch-action: manipulation;
  }
  #aboutOverlay.open {
    display: flex;
  }

  #aboutCard {
    width: min(360px, 86vw);
    background: #111111;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 24px 22px;
    color: rgba(235,235,235,0.92);
    font: 14px/1.55 system-ui, sans-serif;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    cursor: default;
  }
  #aboutCard h2 {
    margin: 0 0 4px;
    font-size: 16px;
    letter-spacing: 0.2px;
  }
  #aboutCard .role {
    margin: 0 0 14px;
    color: rgba(235,235,235,0.5);
    font-size: 12.5px;
  }
  #aboutCard p {
    margin: 0 0 10px;
  }
  #aboutClose {
    display: block;
    margin: 16px 0 0 auto;
    padding: 7px 14px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    color: rgba(235,235,235,0.8);
    font: 12.5px system-ui, sans-serif;
    cursor: pointer;
  }
  #aboutClose:hover {
    background: rgba(255,255,255,0.1);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hint">move your mouse or drag your finger — the scorpion follows</div>

<button id="aboutBtn">About the Developer</button>

<div id="aboutOverlay">
  <div id="aboutCard">
    <h2>Muhammad Aliyan</h2>
    <p class="role">BSCS Student, Virtual University</p>
    <p>I design and develop websites, Android apps &amp; games with a mix of my own logic and AI assistance.</p>
    <p>Always learning, always building.</p>
    <p>Your feedback helps me improve!</p>
    <button id="aboutClose">Close</button>
  </div>
</div>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---------- mouse & touch tracking ----------
const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
function handleTouch(e) {
  if (e.target.closest && e.target.closest('#aboutBtn, #aboutOverlay')) return;
  const t = e.touches[0];
  if (t) { mouse.x = t.clientX; mouse.y = t.clientY; }
  e.preventDefault();
}
window.addEventListener('touchstart', handleTouch, { passive: false });
window.addEventListener('touchmove', handleTouch, { passive: false });

// ---------- helpers ----------
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function constrain(point, anchor, distance) {
  const dx = point.x - anchor.x;
  const dy = point.y - anchor.y;
  const d = Math.hypot(dx, dy) || 0.0001;
  const k = distance / d;
  return { x: anchor.x + dx * k, y: anchor.y + dy * k };
}

function lerp(a, b, t) { return a + (b - a) * t; }

// ---------- body chain ----------
const BODY_COUNT = 20;
const SEG_LEN = 13;
const segments = [];
for (let i = 0; i < BODY_COUNT; i++) {
  segments.push({ x: mouse.x - i * SEG_LEN, y: mouse.y });
}

function bodyWidth(i) {
  const t = i / (BODY_COUNT - 1);
  const head = Math.min(1, i / 3);
  const taper = 1 - Math.pow(t, 1.6);
  return (6 + 12 * head * taper);
}

// ---------- tail chain ----------
const TAIL_COUNT = 13;
const tail = [];
for (let i = 0; i < TAIL_COUNT; i++) {
  tail.push({ x: 0, y: 0 });
}
function tailWidth(i) {
  const t = i / (TAIL_COUNT - 1);
  return lerp(7, 1.5, t);
}

let time = 0;

function dirAt(arr, i) {
  const a = arr[Math.max(0, i - 1)];
  const b = arr[Math.min(arr.length - 1, i + 1)];
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = Math.hypot(dx, dy) || 0.0001;
  return { x: dx / d, y: dy / d };
}
function perp(d) { return { x: -d.y, y: d.x }; }

// ---------- legs ----------
const LEG_ATTACH = [3, 3, 6, 6, 9, 9, 12, 12];
const LEG_SIDE   = [-1, 1, -1, 1, -1, 1, -1, 1];
const LEG_REACH  = [34, 34, 40, 40, 40, 40, 34, 34];
const legs = LEG_ATTACH.map((idx, i) => ({
  attach: idx,
  side: LEG_SIDE[i],
  reach: LEG_REACH[i],
  foot: { x: segments[idx].x, y: segments[idx].y + LEG_SIDE[i] * 60 },
  phase: i * 0.9
}));

// ---------- claws ----------
const claws = [
  { side: -1, elbow: { x: 0, y: 0 }, tip: { x: 0, y: 0 } },
  { side: 1,  elbow: { x: 0, y: 0 }, tip: { x: 0, y: 0 } }
];

function drawVertebra(p, d, w) {
  const pp = perp(d);
  ctx.beginPath();
  ctx.moveTo(p.x - pp.x * w, p.y - pp.y * w);
  ctx.lineTo(p.x + pp.x * w, p.y + pp.y * w);
  ctx.stroke();
}

function drawLegSegment(hip, foot, side, bend) {
  const mx = (hip.x + foot.x) / 2;
  const my = (hip.y + foot.y) / 2;
  const dx = foot.x - hip.x, dy = foot.y - hip.y;
  const len = Math.hypot(dx, dy) || 0.0001;
  const px = -dy / len, py = dx / len;
  const knee = { x: mx + px * bend * side, y: my + py * bend * side };

  ctx.beginPath();
  ctx.moveTo(hip.x, hip.y);
  ctx.lineTo(knee.x, knee.y);
  ctx.lineTo(foot.x, foot.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(foot.x, foot.y, 1.6, 0, Math.PI * 2);
  ctx.fill();

  return knee;
}

function update() {
  time += 0.016;

  const head = segments[0];
  head.x = lerp(head.x, mouse.x, 0.35);
  head.y = lerp(head.y, mouse.y, 0.35);

  for (let i = 1; i < segments.length; i++) {
    segments[i] = constrain(segments[i], segments[i - 1], SEG_LEN);
  }

  const speed = Math.min(1, dist({ x: mouse.x, y: mouse.y }, head) / 12);

  legs.forEach((leg) => {
    const p = segments[leg.attach];
    const d = dirAt(segments, leg.attach);
    const pp = perp(d);
    const step = Math.sin(time * (4 + speed * 6) + leg.phase) * (6 + speed * 10);
    const target = {
      x: p.x + pp.x * leg.side * leg.reach + d.x * step,
      y: p.y + pp.y * leg.side * leg.reach + d.y * step
    };
    leg.foot.x = lerp(leg.foot.x, target.x, 0.18);
    leg.foot.y = lerp(leg.foot.y, target.y, 0.18);
  });

  const headDir = dirAt(segments, 0);
  const headPerp = perp(headDir);
  claws.forEach((c) => {
    const spread = 14;
    const forward = 26;
    c.elbow.x = head.x + headDir.x * forward * 0.6 + headPerp.x * c.side * spread;
    c.elbow.y = head.y + headDir.y * forward * 0.6 + headPerp.y * c.side * spread;
    c.tip.x = head.x + headDir.x * forward + headPerp.x * c.side * (spread + 10);
    c.tip.y = head.y + headDir.y * forward + headPerp.y * c.side * (spread + 10);
  });

  const base = segments[segments.length - 1];
  const baseDir = dirAt(segments, segments.length - 1);
  let curDir = { x: -baseDir.x, y: -baseDir.y };
  const startAngle = Math.atan2(curDir.y, curDir.x) - 1.1;
  let angle = startAngle;
  let prev = base;
  const curlAmount = 0.175;
  const wobble = Math.sin(time * 1.4) * 0.05;

  for (let i = 0; i < TAIL_COUNT; i++) {
    angle += curlAmount + wobble * (i / TAIL_COUNT);
    const len = lerp(SEG_LEN, SEG_LEN * 0.55, i / TAIL_COUNT);
    const p = {
      x: prev.x + Math.cos(angle) * len,
      y: prev.y + Math.sin(angle) * len
    };
    tail[i] = p;
    prev = p;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(235,235,235,0.9)';
  ctx.fillStyle = 'rgba(235,235,235,0.9)';
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(255,255,255,0.35)';
  ctx.shadowBlur = 4;

  legs.forEach((leg) => {
    const hip = segments[leg.attach];
    drawLegSegment(hip, leg.foot, leg.side, leg.reach * 0.35);
  });

  claws.forEach((c) => {
    const head = segments[0];
    ctx.beginPath();
    ctx.moveTo(head.x, head.y);
    ctx.lineTo(c.elbow.x, c.elbow.y);
    ctx.lineTo(c.tip.x, c.tip.y);
    ctx.stroke();

    const d = dirAt(segments, 0);
    const pp = perp(d);
    const prongA = { x: c.tip.x + d.x * 8 + pp.x * c.side * 5, y: c.tip.y + d.y * 8 + pp.y * c.side * 5 };
    const prongB = { x: c.tip.x + d.x * 8 - pp.x * c.side * 3, y: c.tip.y + d.y * 8 - pp.y * c.side * 3 };
    ctx.beginPath();
    ctx.moveTo(c.tip.x, c.tip.y);
    ctx.lineTo(prongA.x, prongA.y);
    ctx.moveTo(c.tip.x, c.tip.y);
    ctx.lineTo(prongB.x, prongB.y);
    ctx.stroke();
  });

  ctx.beginPath();
  ctx.moveTo(segments[0].x, segments[0].y);
  for (let i = 1; i < segments.length; i++) {
    ctx.lineTo(segments[i].x, segments[i].y);
  }
  ctx.stroke();

  for (let i = 0; i < segments.length; i++) {
    const d = dirAt(segments, i);
    drawVertebra(segments[i], d, bodyWidth(i));
    ctx.beginPath();
    ctx.arc(segments[i].x, segments[i].y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  const head = segments[0];
  const hd = dirAt(segments, 0);
  ctx.beginPath();
  ctx.arc(head.x + hd.x * 4, head.y + hd.y * 4, 3.2, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(segments[segments.length - 1].x, segments[segments.length - 1].y);
  for (let i = 0; i < tail.length; i++) {
    ctx.lineTo(tail[i].x, tail[i].y);
  }
  ctx.stroke();

  for (let i = 0; i < tail.length; i++) {
    const prevP = i === 0 ? segments[segments.length - 1] : tail[i - 1];
    const d = { x: tail[i].x - prevP.x, y: tail[i].y - prevP.y };
    const dl = Math.hypot(d.x, d.y) || 0.0001;
    drawVertebra(tail[i], { x: d.x / dl, y: d.y / dl }, tailWidth(i));
    ctx.beginPath();
    ctx.arc(tail[i].x, tail[i].y, 1.3, 0, Math.PI * 2);
    ctx.fill();
  }

  const tipA = tail[tail.length - 2];
  const tipB = tail[tail.length - 1];
  const stingDir = { x: tipB.x - tipA.x, y: tipB.y - tipA.y };
  const sl = Math.hypot(stingDir.x, stingDir.y) || 0.0001;
  const sd = { x: stingDir.x / sl, y: stingDir.y / sl };
  const spd = perp(sd);
  const stingerTip = {
    x: tipB.x + sd.x * 12 + spd.x * -3,
    y: tipB.y + sd.y * 12 + spd.y * -3
  };
  ctx.beginPath();
  ctx.moveTo(tipB.x, tipB.y);
  ctx.quadraticCurveTo(
    tipB.x + sd.x * 8 + spd.x * 4,
    tipB.y + sd.y * 8 + spd.y * 4,
    stingerTip.x, stingerTip.y
  );
  ctx.stroke();

  ctx.shadowBlur = 0;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ---------- about developer modal ----------
const aboutBtn = document.getElementById('aboutBtn');
const aboutOverlay = document.getElementById('aboutOverlay');
const aboutClose = document.getElementById('aboutClose');

function openAbout() { aboutOverlay.classList.add('open'); }
function closeAbout() { aboutOverlay.classList.remove('open'); }

aboutBtn.addEventListener('click', openAbout);
aboutClose.addEventListener('click', closeAbout);
aboutOverlay.addEventListener('click', (e) => {
  if (e.target === aboutOverlay) closeAbout();
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeAbout();
});
</script>
</body>
</html>
